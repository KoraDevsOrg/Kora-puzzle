<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KoraPuzzle - Motor de Arrastre Libre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- MENÚ PRINCIPAL -->
        <section id="view-menu" class="screen">
            <header>
                <h1>🧩 KoraPuzzle Engine</h1>
                <p>Rompecabezas de Arrastre Libre y Fluido</p>
            </header>

            <div class="menu-card">
                <div class="form-group">
                    <label for="grid-size">Dificultad (Piezas):</label>
                    <select id="grid-size">
                        <option value="3">3 x 3 (9 Piezas - Fácil)</option>
                        <option value="4" selected>4 x 4 (16 Piezas - Normal)</option>
                        <option value="5">5 x 5 (25 Piezas - Desafío)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Imagen del Puzzle:</label>
                    <input type="text" id="image-url" value="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800">
                    <label for="local-image" class="btn-secondary" style="margin-top: 8px; display: block; text-align: center;">📁 Cargar Foto del Celular</label>
                    <input type="file" id="local-image" accept="image/*" style="display: none;">
                </div>

                <div class="preview-container">
                    <img id="image-preview" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800" alt="Preview">
                </div>

                <button id="start-game-btn" class="btn-primary">¡Comenzar Partida!</button>
            </div>
        </section>

        <!-- ÁREA DE JUEGO / LIENZO LIBRE -->
        <section id="view-game" class="screen hidden">
            <div class="game-header">
                <button class="btn-back" id="back-to-menu-btn">⬅ Menú</button>
                <div class="stats">
                    <span>Armadas: <strong id="score-count">0</strong>/<span id="total-target">16</span></span>
                    <span>Tiempo: <strong id="timer">00:00</strong></span>
                </div>
            </div>

            <div id="game-canvas" class="game-canvas">
                <!-- Tablero de destino transparente o marcado -->
                <div id="puzzle-board" class="puzzle-board"></div>
                <!-- Área libre donde flotan las piezas al iniciar -->
                <div id="pieces-container" class="pieces-container"></div>
            </div>
        </section>
    </div>

    <!-- MODAL DE VICTORIA -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 ¡Increíble, Diego!</h2>
            <p>Rompecabezas completado con éxito.</p>
            <button class="btn-primary" id="play-again-btn">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- SCRIPTS MODULARES -->
    <script src="js/core.js"></script>
    <script src="js/puzzle-engine.js"></script>
</body>
</html>
